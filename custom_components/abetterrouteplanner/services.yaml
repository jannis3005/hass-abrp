send_telemetry:
  name: Send telemetry
  description: Send telemetry data to A Better Route Planner
  fields:
    utc:
      name: Timestamp
      description: Unix timestamp (seconds since epoch). If not provided, current time is used.
      example: 1732265932
      selector:
        number:
          min: 0
    soc:
      name: State of charge
      description: Battery state of charge in percent (0-100)
      example: 85.5
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    soh:
      name: State of health
      description: Battery state of health in percent (0-100)
      example: 95.0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    power:
      name: Power
      description: Power consumption/generation in kW
      example: -15.5
      selector:
        number:
          unit_of_measurement: "kW"
    speed:
      name: Speed
      description: Vehicle speed in km/h
      example: 100.0
      selector:
        number:
          min: 0
          unit_of_measurement: "km/h"
    est_battery_range:
      name: Estimated battery range
      description: Vehicle's estimated remaining battery range in km
      example: 250.0
      selector:
        number:
          min: 0
          unit_of_measurement: "km"
    odometer:
      name: Odometer
      description: Vehicle total odometer reading in km
      example: 30000.0
      selector:
        number:
          min: 0
          unit_of_measurement: "km"
    lat:
      name: Latitude
      description: GPS latitude coordinate
      example: 47.6062
      selector:
        number:
          min: -90
          max: 90
    lon:
      name: Longitude
      description: GPS longitude coordinate
      example: -122.3321
      selector:
        number:
          min: -180
          max: 180
    heading:
      name: Heading
      description: Vehicle heading in degrees (0-360)
      example: 180
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: "°"
    elevation:
      name: Elevation
      description: Vehicle elevation above sea level in meters
      example: 100.0
      selector:
        number:
          unit_of_measurement: "m"
    ext_temp:
      name: External temperature
      description: Outside temperature in Celsius
      example: 20.5
      selector:
        number:
          unit_of_measurement: "°C"
    batt_temp:
      name: Battery temperature
      description: Battery temperature in Celsius
      example: 25.0
      selector:
        number:
          unit_of_measurement: "°C"
    is_charging:
      name: Is charging
      description: Whether the vehicle is currently charging
      example: true
      selector:
        boolean:
    is_draining:
      name: Is draining
      description: Whether the vehicle is currently driving/discharging
      example: true
      selector:
        boolean:
    is_parked:
      name: Is parked
      description: Whether the vehicle is currently parked
      example: false
      selector:
        boolean:
